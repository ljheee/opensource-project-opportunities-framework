category:
  name: "ai"
  display_name: "AI Projects"
  version: "1.0.0"

dimensions:
  tech_layer:
    - id: foundation_model
      name: "Foundation Model"
    - id: training_framework
      name: "Training Framework"
    - id: inference_engine
      name: "Inference Engine"
    - id: ai_application
      name: "AI Application"
    - id: ai_toolchain
      name: "AI Toolchain"

  application:
    - id: code_generation
      name: "Code Generation"
    - id: image_generation
      name: "Image Generation"
    - id: multimodal
      name: "Multimodal"
    - id: agent
      name: "Agent"
    - id: data_annotation
      name: "Data Annotation"
    - id: model_evaluation
      name: "Model Evaluation"

sources:
  github:
    topics:
      - "artificial-intelligence"
      - "machine-learning"
      - "deep-learning"
      - "llm"
      - "generative-ai"
      - "ai-agents"
    languages: ["Python", "TypeScript", "Rust", "Go"]
    star_range: [50, 50000]
    created_within_days: 730
    backfill_max_pages: 30
    backfill_max_per_day: 50
    structure_max_per_day: 50

  trending:
    languages: ["python", "typescript", "rust", "go"]
    periods: ["daily", "weekly"]

  ecosystems:
    - "huggingface"
    - "openai"
    - "langchain-ai"
    - "pytorch"

early_burst:
  enabled: true
  min_score: 0.65
  metrics:
    star_velocity:
      weight: 0.40
    activity_index:
      weight: 0.30
    community_buzz:
      weight: 0.10
      thresholds:
        default_score: 0.3
        reaction_total_full: 50
        active_issues_full: 5
        avg_comments_full: 5
    novelty_signal:
      weight: 0.20

filters:
  required:
    has_readme: true
    has_code: true
  skip_patterns:
    - "awesome"
    - "tutorial"
    - "demo"
    - "examples"
    - "course"
    - "curated-list"
  category_keywords:
    ai:
      - "llm"
      - "ai"
      - "machine-learning"
      - "deep-learning"
      - "neural"
      - "transformer"
      - "gpt"
      - "bert"
      - "llama"
      - "model"
      - "inference"
      - "training"
      - "fine-tuning"
      - "embedding"
      - "vector"
      - "agent"
      - "generative"
      - "diffusion"
      - "stable-diffusion"
      - "openai"
      - "langchain"
      - "huggingface"
      - "pytorch"
      - "tensorflow"
  tech_layer_rules:
    foundation_model:
      - "foundation"
      - "llm"
      - "model"
      - "gpt"
      - "bert"
    inference_engine:
      - "inference"
      - "serving"
      - "deployment"
    training_framework:
      - "training"
      - "fine-tune"
      - "distributed"
    ai_toolchain:
      - "tool"
      - "sdk"
      - "library"
      - "framework"
  known_ecosystem_packages:
    - "langchain"
    - "langchain-core"
    - "llama-index"
    - "openai"
    - "anthropic"
    - "llama-cpp-python"
    - "haystack-ai"
    - "semantic-kernel"
    - "dspy"

scheduling:
  bulk:
    batch_size: 20
    max_per_day: 100
  incremental:
    max_per_day: 15
    star_change_threshold: 0.05
    recent_commit_days: 3
    min_reanalyze_days: 7

resilience:
  github_api:
    max_retries: 3
    retry_delay_seconds: 60
  llm_analysis:
    max_retries: 2
    timeout_seconds: 300
