name: Daily Discover

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - bulk

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode || 'incremental' }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      # Disable Python output buffering so print() shows up in real time.
      # Without this, stdout is fully-buffered when not a tty, and a long
      # run shows ZERO log output until the process exits (or is killed).
      # That was the diagnostic gap behind the 2026-08-28 6h hang.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Init DB
        run: python -u framework/stages/init_db.py

      - name: Crash Recovery
        run: python -u -c "from framework.core.db import Database; db = Database(); db.repair_analyzing_status(); db.repair_orphan_records()"

      - name: Discover
        run: python -u framework/stages/discover.py

      - name: Filter
        run: python -u framework/stages/filter.py

      - name: Schedule
        run: python -u framework/stages/schedule.py --mode "$MODE"

      - name: Analyze
        run: python -u framework/stages/analyze.py --date "$(date -u +%Y-%m-%d)"

      - name: Validate Predictions
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'bulk'
        run: python -u framework/stages/validate.py

      - name: Report
        run: python -u framework/stages/report.py --date "$(date -u +%Y-%m-%d)"

      - name: Auto-tune Weights
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            python framework/stages/reweight.py --dry-run
          else
            echo "Skipping weight audit (not 1st of month)"
          fi

      - name: Checkpoint WAL
        run: |
          if [ -f data/framework.db ]; then
            sqlite3 data/framework.db "PRAGMA wal_checkpoint(TRUNCATE);"
          fi

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: $MODE run $(date -u +%Y-%m-%d)"
          git push
