name: Daily Discover

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - bulk

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode || 'incremental' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Init DB
        run: python framework/stages/init_db.py

      - name: Crash Recovery
        run: python -c "from framework.core.db import Database; db = Database(); db.repair_analyzing_status(); db.repair_orphan_records()"

      - name: Discover
        run: python framework/stages/discover.py

      - name: Filter
        run: python framework/stages/filter.py

      - name: Schedule
        run: python framework/stages/schedule.py --mode "$MODE"

      - name: Analyze
        run: python framework/stages/analyze.py --date "$(date -u +%Y-%m-%d)"

      - name: Report
        run: python framework/stages/report.py --date "$(date -u +%Y-%m-%d)"

      - name: Checkpoint WAL
        run: sqlite3 data/framework.db "PRAGMA wal_checkpoint(TRUNCATE);" || true

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: $MODE run $(date -u +%Y-%m-%d)"
          git push
